<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Elsewhere Almanac</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2320162E'/><circle cx='16' cy='16' r='7.5' fill='none' stroke='%23E0A548' stroke-width='2.5'/><circle cx='16' cy='16' r='2.2' fill='%23E0A548'/></svg>">
<style>
/* Declare the scheme this toy is actually drawn in. Without it a browser
   running forced dark mode will invert the whole page — the cream card
   comes back dark brown, the ink comes back pale, and the illustrated
   background is flattened to black. */
:root{ color-scheme: dark; }
:root{
  --ink:#101C18;
  --ink-2:#1B2B24;
  --paper:#ECE1C6;
  --paper-2:#DECBA0;
  --brass:#A9803F;
  --brass-hi:#D6AA5C;
  --rust:#8B4632;
  --text:#2C2A1E;
  --text-soft:#5B5641;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:#0B140F;
  color:var(--text);
  font-family:var(--serif);
  display:flex;align-items:center;justify-content:center;
  padding:32px 16px;
}
/* --- weather backdrop: two crossfading tint layers, then the particle
       canvas, then a soft scrim that keeps the card legible over the
       brightest and busiest effects. All behind .frame. --- */
.bg-layer{
  position:fixed;inset:0;z-index:-3;opacity:0;
  transition:opacity 1.15s ease;
  overflow:hidden;
}
.bg-layer.on{ opacity:1 }
.bg-layer svg.scene{ position:absolute;inset:0;width:100%;height:100% }
#fx{
  position:fixed;inset:0;z-index:-2;display:block;pointer-events:none;
}
.scrim{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  /* the illustrated scenes are far brighter than the flat gradients they
     replaced, so the card needs more separation than before */
  background:radial-gradient(760px 660px at 50% 50%,
    rgba(4,8,6,.30) 0%, rgba(4,8,6,.16) 46%, rgba(4,8,6,0) 80%);
}
.frame{
  width:100%;max-width:560px;
  background:
    linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  border-radius:6px;
  padding:30px 28px 24px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.35),
    0 0 0 7px var(--ink-2),
    0 0 0 8px rgba(169,128,63,.5),
    0 30px 60px rgba(0,0,0,.55);
  position:relative;
}
.frame::before{ /* corner rivets */
  content:"";position:absolute;inset:10px;
  border:1px solid rgba(139,70,50,.18);
  border-radius:3px;pointer-events:none;
}
.masthead{
  text-align:center;margin-bottom:6px;
}
.masthead .kicker{
  font-family:var(--mono);
  font-size:11px;letter-spacing:.14em;
  color:var(--text-soft);
}
.masthead h1{
  margin:2px 0 0;
  font-size:23px;font-weight:600;font-style:italic;
  letter-spacing:.01em;
  color:var(--text);
}
.void-note{
  margin:12px 0 0;text-align:center;
  font-family:var(--mono,ui-monospace,Menlo,monospace);font-size:10.5px;
  letter-spacing:.14em;text-transform:uppercase;opacity:.62;
}
.prose.extreme{
  margin-top:14px;padding-left:12px;border-left:2px solid #C8503C;
}

.dial-wrap{
  display:flex;justify-content:center;margin:14px 0 4px;
}
#dial{ width:150px;height:150px;display:block }
#needle{ transform-origin:75px 75px; transition:transform 1.1s cubic-bezier(.34,1.4,.4,1) }
.place-strip{
  display:flex;gap:7px;overflow-x:auto;padding:14px 2px 6px;
  scrollbar-width:none;
}
.place-strip::-webkit-scrollbar{display:none}
.plate{
  flex:none;border:1px solid rgba(44,42,30,.22);background:rgba(255,255,255,.28);
  color:var(--text-soft);font-family:var(--mono);font-size:12px;
  padding:7px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s;
}
.plate:hover{background:rgba(255,255,255,.5)}
.plate.on{
  background:var(--ink);color:var(--paper);border-color:var(--ink);
}
.report{ min-height:214px }
.place-line{
  text-align:center;margin:6px 0 0;
}
.place-line .name{ font-size:26px;font-weight:600;letter-spacing:.01em }
.place-line .tag{
  display:block;font-family:var(--mono);font-size:11.5px;color:var(--text-soft);
  margin-top:1px;
}
.temp-line{
  text-align:center;margin:14px 0 12px;font-size:17px;color:var(--text);
}
.temp-line b{ font-size:34px;font-weight:600;margin-right:8px }
.prose{
  font-size:16px;line-height:1.65;color:var(--text);
  padding:0 4px;min-height:82px;
}
.prose em{ font-style:italic;color:var(--rust) }
.ledger{
  margin-top:16px;border-top:1px solid rgba(44,42,30,.2);
  padding-top:12px;
  display:grid;grid-template-columns:auto 1fr;gap:6px 14px;
  font-family:var(--mono);font-size:12.5px;color:var(--text-soft);
}
.ledger dt{ color:var(--text-soft) }
.ledger dd{ margin:0;color:var(--text);text-align:right }
.byline{
  text-align:center;margin-top:16px;font-family:var(--mono);
  font-size:11px;color:var(--text-soft);font-style:italic;
}
.actions{ display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap }
button.consult.ghost{
  background:transparent;color:var(--ink-2);
  border:1px solid rgba(44,42,30,.42);
  box-shadow:none;
}
button.consult.ghost:hover{ background:rgba(255,255,255,.34) }
button.consult.ghost:active{ transform:translateY(2px);box-shadow:none }
button.consult{
  font-family:var(--serif);font-style:italic;font-size:15px;
  background:var(--rust);color:var(--paper);border:0;
  padding:11px 26px;border-radius:3px;cursor:pointer;
  box-shadow:0 2px 0 #5f3021, 0 6px 14px rgba(0,0,0,.3);
  transition:transform .08s;
}
button.consult:active{ transform:translateY(2px);box-shadow:0 0 0 #5f3021 }
button.consult:focus-visible{ outline:2px solid var(--brass-hi);outline-offset:3px }
.fade{ animation:fadein .5s ease both }
@keyframes fadein{ from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
@media (prefers-reduced-motion:reduce){
  #needle{ transition:none }
  .fade{ animation:none }
}
@media (max-width:420px){
  .frame{ padding:24px 18px 20px }
  .place-line .name{ font-size:22px }
  .temp-line b{ font-size:28px }
}

/* ---------- shared: back to the cabinet ----------
   Every toy carries the same control in the same place, so there is always
   one way out that does not depend on scrolling to a footer. It sits as a
   compact disc and opens to the word on hover or focus, because a wide
   permanent chip covers whatever is in the corner of a scrolling page. */
#lc-back{
  position:fixed;left:14px;bottom:14px;z-index:9999;
  display:inline-flex;align-items:center;gap:0;overflow:hidden;
  font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  color:#F4F5F6;background:rgba(18,19,22,.82);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  width:38px;height:38px;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:width .18s ease, background .16s, border-color .16s, gap .18s ease;
}
#lc-back .a{ font-size:15px;line-height:1;flex:0 0 auto }
#lc-back .w{ max-width:0;opacity:0;transition:max-width .18s ease, opacity .14s ease }
#lc-back:hover, #lc-back:focus-visible{
  width:118px;gap:9px;background:rgba(18,19,22,.96);border-color:rgba(255,255,255,.6);
}
#lc-back:hover .w, #lc-back:focus-visible .w{ max-width:80px;opacity:1 }
#lc-back:focus-visible{ outline:2px solid #7FD8FF;outline-offset:3px }
/* so the foot of a page can always scroll clear of it */
body{ padding-bottom:64px }
@media (max-width:520px){ #lc-back{ left:10px;bottom:10px } }
@media print{ #lc-back{ display:none } }
@media (prefers-reduced-motion: reduce){ #lc-back{ transition:none } }
</style>
</head>
<body>
<a id="lc-back" href="/" aria-label="Back to the cabinet"><span class="a" aria-hidden="true">←</span><span class="w">cabinet</span></a>


<div class="bg-layer" id="bgA" aria-hidden="true"></div>
<div class="bg-layer" id="bgB" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="scrim" aria-hidden="true"></div>

<div class="frame">
  <div class="masthead">
    <div class="kicker">the elsewhere almanac</div>
    <h1>Weather from places that aren't real</h1>
  </div>

  <div class="dial-wrap">
    <svg id="dial" viewBox="0 0 150 150">
      <circle cx="75" cy="75" r="70" fill="none" stroke="#A9803F" stroke-width="2" opacity=".55"/>
      <circle cx="75" cy="75" r="62" fill="none" stroke="#8B4632" stroke-width="1" opacity=".4"/>
      <g id="ticks" stroke="#5B5641" stroke-width="1.4" opacity=".7"></g>
      <text x="75" y="24" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5B5641">wild</text>
      <text x="75" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#5B5641">still</text>
      <line id="needle" x1="75" y1="75" x2="75" y2="20" stroke="#8B4632" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="75" cy="75" r="5.5" fill="#8B4632"/>
      <circle cx="75" cy="75" r="2" fill="#ECE1C6"/>
    </svg>
  </div>

  <div class="place-strip" id="places"></div>

  <div class="report" id="report"></div>

  <div class="actions">
    <button class="consult" id="go">Consult the almanac</button>
    <button class="consult ghost" id="surprise">Surprise me</button>
  </div>
</div>

<script src="/shared/lc-weather-fx.js"></script>

/* ------------------------ background weather ------------------------ *
 *  One canvas behind the card. Twelve named effects, each a small
 *  spawn/step pair over one shared particle loop, plus a paired gradient
 *  tint that crossfades between the two .bg-layer divs.
 * -------------------------------------------------------------------- */

/* ================= illustrated backdrops =========================== *
 *  Each effect gets a built scene, not a flat wash: a graded sky, two
 *  to four silhouette bands that lighten toward the horizon for depth,
 *  an optional light source, and grain over the moodier ones. The
 *  particle field then sits on top of this as foreground detail.
 *  Everything is drawn here — no photography, stock or otherwise.
 * ------------------------------------------------------------------- */

const SW = 1000, SH = 620;                 // scene coordinate space

function prng(seed){
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

/* --- silhouette generators. Each returns a closed path across the frame. */
function ridge(rand, opts){
  // midpoint displacement gives a believable jagged skyline
  const { base, amp, rough = 0.55, steps = 6 } = opts;
  let pts = [[0, base + (rand() - 0.5) * amp * 0.4], [SW, base + (rand() - 0.5) * amp * 0.4]];
  let a = amp;
  for (let s = 0; s < steps; s++){
    const next = [];
    for (let i = 0; i < pts.length - 1; i++){
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      next.push(pts[i]);
      next.push([(x1 + x2) / 2, (y1 + y2) / 2 + (rand() - 0.5) * a]);
    }
    next.push(pts[pts.length - 1]);
    pts = next; a *= rough;
  }
  return 'M0,' + SH + ' L' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') +
         ' L' + SW + ',' + SH + ' Z';
}

function hills(rand, opts){
  const { base, amp, n = 4 } = opts;
  let d = 'M0,' + SH + ' L0,' + base.toFixed(1);
  const seg = SW / n;
  let x = 0, y = base;
  for (let i = 0; i < n; i++){
    const nx = x + seg, ny = base + (rand() - 0.5) * amp;
    d += ' Q' + (x + seg * 0.5).toFixed(1) + ',' + (y - amp * (0.4 + rand() * 0.7)).toFixed(1) +
         ' ' + nx.toFixed(1) + ',' + ny.toFixed(1);
    x = nx; y = ny;
  }
  return d + ' L' + SW + ',' + SH + ' Z';
}

function dunes(rand, opts){
  const { base, amp, n = 3 } = opts;
  let d = 'M0,' + SH + ' L0,' + (base + amp * 0.3).toFixed(1);
  let x = 0;
  for (let i = 0; i < n; i++){
    const w = SW / n;
    const crest = base - amp * (0.5 + rand() * 0.6);
    d += ' C' + (x + w * 0.34).toFixed(1) + ',' + crest.toFixed(1) +
         ' ' + (x + w * 0.52).toFixed(1) + ',' + crest.toFixed(1) +
         ' ' + (x + w).toFixed(1) + ',' + (base + (rand() - 0.5) * amp * 0.4).toFixed(1);
    x += w;
  }
  return d + ' L' + SW + ',' + SH + ' Z';
}

function skyline(rand, opts){
  const { base, amp, minW = 26, maxW = 74 } = opts;
  let d = 'M0,' + SH + ' L0,' + base.toFixed(1);
  let x = 0;
  while (x < SW){
    const w = minW + rand() * (maxW - minW);
    const h = amp * (0.25 + rand() * rand() * 1.5);
    const top = base - h;
    d += ' L' + x.toFixed(1) + ',' + top.toFixed(1) + ' L' + Math.min(SW, x + w).toFixed(1) + ',' + top.toFixed(1);
    // the occasional mast
    if (rand() < 0.16){
      const mx = x + w * 0.5, mt = top - h * (0.18 + rand() * 0.3);
      d += ' L' + mx.toFixed(1) + ',' + top.toFixed(1) + ' L' + mx.toFixed(1) + ',' + mt.toFixed(1) +
           ' L' + mx.toFixed(1) + ',' + top.toFixed(1);
    }
    x += w;
    d += ' L' + Math.min(SW, x).toFixed(1) + ',' + base.toFixed(1);
  }
  return d + ' L' + SW + ',' + SH + ' Z';
}

function forest(rand, opts){
  const { base, amp } = opts;
  let d = 'M0,' + SH + ' L0,' + base.toFixed(1);
  let x = -10;
  while (x < SW + 10){
    const w = 12 + rand() * 26;
    const h = amp * (0.45 + rand() * 0.95);
    d += ' L' + x.toFixed(1) + ',' + base.toFixed(1) +
         ' L' + (x + w * 0.5).toFixed(1) + ',' + (base - h).toFixed(1) +
         ' L' + (x + w).toFixed(1) + ',' + base.toFixed(1);
    x += w * 0.72;
  }
  return d + ' L' + SW + ',' + SH + ' Z';
}

function ruins(rand, opts){
  const { base, amp } = opts;
  let d = 'M0,' + SH + ' L0,' + base.toFixed(1);
  let x = 0;
  while (x < SW){
    const w = 30 + rand() * 90;
    if (rand() < 0.32){ x += w; d += ' L' + Math.min(SW,x).toFixed(1) + ',' + base.toFixed(1); continue; }
    const h = amp * (0.3 + rand() * 1.2);
    const top = base - h;
    // broken, uneven crown
    d += ' L' + x.toFixed(1) + ',' + top.toFixed(1);
    const bits = 2 + Math.floor(rand() * 3);
    for (let b = 1; b <= bits; b++){
      const bx = x + (w * b) / bits;
      d += ' L' + bx.toFixed(1) + ',' + (top + rand() * h * 0.45).toFixed(1);
    }
    x += w;
    d += ' L' + Math.min(SW, x).toFixed(1) + ',' + base.toFixed(1);
  }
  return d + ' L' + SW + ',' + SH + ' Z';
}

function flat(rand, opts){
  const { base, amp } = opts;
  let d = 'M0,' + SH + ' L0,' + base.toFixed(1);
  for (let x = 0; x <= SW; x += 40){
    d += ' L' + x + ',' + (base + Math.sin(x / 90 + rand()) * amp * 0.16).toFixed(1);
  }
  return d + ' L' + SW + ',' + SH + ' Z';
}

/* sand needs its own dune stack */
SCENES.sand = { seed: 23,
  sky: ['#E8BE72', '#C08637', '#5C3A12'],
  sun: { x:.66, y:.3, r:.34, c:'rgba(255,226,150,.5)' },
  bands: [
    { s:'dunes', base:308, amp:122,  fill:'#C39150', op:.55, blur:2.6 },
    { s:'dunes', base:366, amp:133, fill:'#96682F', op:.8,  blur:1.1 },
    { s:'dunes', base:430, amp:117,  fill:'#5E3D16', op:.95 },
    { s:'dunes', base:486, amp:81,  fill:'#33200A', op:1 },
  ], grain:.08 };

function buildScene(name){
  const sc = SCENES[name] || SCENES.calm;
  const rand = prng(sc.seed);
  const id = 'sc' + name.replace(/[^a-z]/g,'');
  let defs =
    '<linearGradient id="' + id + 'sky" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + sc.sky[0] + '"/>' +
      '<stop offset="52%" stop-color="' + sc.sky[1] + '"/>' +
      '<stop offset="100%" stop-color="' + sc.sky[2] + '"/>' +
    '</linearGradient>';

  let body = '<rect width="' + SW + '" height="' + SH + '" fill="url(#' + id + 'sky)"/>';

  if (sc.sun){
    defs += '<radialGradient id="' + id + 'sun">' +
      '<stop offset="0%" stop-color="' + sc.sun.c + '"/>' +
      '<stop offset="100%" stop-color="transparent"/></radialGradient>';
    body += '<ellipse cx="' + (sc.sun.x*SW).toFixed(0) + '" cy="' + (sc.sun.y*SH).toFixed(0) +
            '" rx="' + (sc.sun.r*SW).toFixed(0) + '" ry="' + (sc.sun.r*SH*1.1).toFixed(0) +
            '" fill="url(#' + id + 'sun)"/>';
  }

  if (sc.curtains){
    // aurora ribbons, drawn rather than particled
    for (let i = 0; i < 7; i++){
      const x = 90 + i * 130 + rand()*60, w = 26 + rand()*54;
      const gid = id + 'c' + i;
      defs += '<linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="rgba(120,255,205,0)"/>' +
        '<stop offset="42%" stop-color="rgba(120,255,205,' + (0.10 + rand()*0.13).toFixed(2) + ')"/>' +
        '<stop offset="100%" stop-color="rgba(90,170,255,0)"/></linearGradient>';
      body += '<rect x="' + x.toFixed(0) + '" y="30" width="' + w.toFixed(0) +
              '" height="' + (250 + rand()*140).toFixed(0) + '" fill="url(#' + gid + ')"/>';
    }
  }

  if (sc.strip){
    // a corridor rather than a horizon: walls converging on a vanishing point,
    // with the ceiling panels receding into it
    const vx = SW/2, vy = 300;
    for (let i = 0; i < 7; i++){
      const t = i / 7, x = t * (SW/2);
      const o = (0.16 - t*0.12).toFixed(3);
      body += '<path d="M' + x.toFixed(0) + ',0 L' + vx + ',' + vy + ' L' + x.toFixed(0) + ',' + SH + ' Z" fill="rgba(0,0,0,' + o + ')"/>';
      body += '<path d="M' + (SW-x).toFixed(0) + ',0 L' + vx + ',' + vy + ' L' + (SW-x).toFixed(0) + ',' + SH + ' Z" fill="rgba(0,0,0,' + o + ')"/>';
    }
    for (let i = 0; i < 6; i++){
      const t = i / 6, w = 300 * (1 - t) + 26, y = 26 + t * (vy - 60);
      body += '<rect x="' + (vx - w/2).toFixed(0) + '" y="' + y.toFixed(0) + '" width="' + w.toFixed(0) +
              '" height="' + (13 * (1 - t) + 3).toFixed(0) + '" rx="3" fill="rgba(255,255,220,' +
              (0.62 - t*0.34).toFixed(2) + ')"/>';
    }
    body += '<rect x="0" y="0" width="' + SW + '" height="70" fill="rgba(245,250,180,.22)"/>';
  }

  sc.bands.forEach((b, i) => {
    const gen = SHAPES[b.s] || SHAPES.hills;
    const d = gen(rand, b);
    const f = b.blur ? ' filter="url(#' + id + 'b' + i + ')"' : '';
    if (b.blur) defs += '<filter id="' + id + 'b' + i + '" x="-6%" y="-20%" width="112%" height="150%">' +
      '<feGaussianBlur stdDeviation="' + b.blur + '"/></filter>';
    body += '<path d="' + d + '" fill="' + b.fill + '" opacity="' + b.op + '"' + f + '/>';
  });

  if (sc.grain){
    defs += '<filter id="' + id + 'g"><feTurbulence type="fractalNoise" baseFrequency="0.9" ' +
      'numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>';
    body += '<rect width="' + SW + '" height="' + SH + '" filter="url(#' + id + 'g)" opacity="' +
      sc.grain + '" style="mix-blend-mode:overlay"/>';
  }

  return '<svg class="scene" viewBox="0 0 ' + SW + ' ' + SH + '" preserveAspectRatio="xMidYMax slice" ' +
         'aria-hidden="true"><defs>' + defs + '</defs>' + body + '</svg>';
}

/* --------------------------- the particle field ---------------------- *
 *  The twelve effects and the loop they share now live in
 *  /shared/lc-weather-fx.js, because the snow globe wanted this same
 *  snow and this same rain and there should not be two of either. What
 *  stays here is what is specific to the almanac: the canvas is the
 *  whole window, and it is hidden entirely under reduced motion.
 * -------------------------------------------------------------------- */
const fxCanvas = $('fx');
const fx = LCWeatherFX.attach(fxCanvas, { w: window.innerWidth, h: window.innerHeight });

function sizeCanvas(){ fx.resize(window.innerWidth, window.innerHeight); }

let activeEffect = null;

function setParticles(name){
  activeEffect = fx.set(name);
}
function startLoop(){ fx.start(); }
function stopLoop(){ fx.stop(); }

/* two layers, crossfaded — the incoming one is painted then faded up */
let tintTop = $('bgA'), tintBack = $('bgB');
const sceneCache = {};
function gradientFor(name){
  if (!sceneCache[name]) sceneCache[name] = buildScene(SCENES[name] ? name : 'calm');
  return sceneCache[name];
}
function setTint(name){
  tintBack.innerHTML = gradientFor(name);
  tintBack.classList.add('on');
  tintTop.classList.remove('on');
  const swap = tintTop; tintTop = tintBack; tintBack = swap;
}

function setEffect(name){
  if (name === activeEffect) return;
  setTint(name);                        // crossfades under reduced motion too
  setParticles(name);
}

// Reduced motion: tint crossfade only, canvas hidden and loop stopped.
function applyMotionPref(){
  if (reduceMotion){
    stopLoop();
    fx.clear();
    fxCanvas.style.display = 'none';
  } else {
    fxCanvas.style.display = '';
    setParticles(activeEffect || 'calm');
    startLoop();
  }
}

/* --------------------------- rendering ------------------------------ */
function renderPlaces(){
  const wrap = $('places');
  wrap.innerHTML = '';
  PLACES.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'plate' + (p === current ? ' on' : '');
    b.textContent = p.name;
    b.onclick = () => { current = p; renderPlaces(); roll(); noteVisit(p); };
    wrap.appendChild(b);
  });
}

function revealActivePlate(){
  const el = $('places').querySelector('.plate.on');
  if (el) el.scrollIntoView({ inline: 'center', block: 'nearest',
                              behavior: reduceMotion ? 'auto' : 'smooth' });
}

function surpriseMe(){
  if (PLACES.length > 1){
    let next = current;
    while (next === current) next = pick(PLACES);
    current = next;
  }
  renderPlaces();
  roll();
  revealActivePlate();
  noteVisit(current);
}

function roll(){
  const p = current;
  const c = pick(p.conditions);
  const temp = between(p.tempRange);
  const wind = pick(p.windOptions);
  const pressure = pick(p.pressureOptions);
  const omen = between(p.omenRange);
  // most places read as a percentage; a few carry their own prefix/unit
  const omenText = (p.omenPrefix || '') + omen + (p.omenUnit === undefined ? '%' : p.omenUnit);
  const opener = pick(OPENERS)(p, c);
  const closer = pick(CLOSERS)(c);

  const html = `
    <div class="place-line fade">
      <span class="name">${p.name}</span>
      <span class="tag">${p.tag}</span>
    </div>
    <div class="temp-line fade"><b>${temp}${p.unit}</b>${c.adj}</div>
    <div class="prose fade">${opener} ${closer}</div>
    <dl class="ledger fade">
      <dt>wind</dt><dd>${wind}</dd>
      <dt>pressure</dt><dd>${pressure}</dd>
      <dt>${p.omenLabel}</dt><dd>${omenText}</dd>
    </dl>
    <div class="byline fade">filed by ${p.meteorologist}</div>
  `;
  $('report').innerHTML = html;

  /* The second: about one report in four hundred comes back off the end of
     the dial. Nothing else changes — the same place, the same machinery —
     and it is gone again as soon as you roll another. */
  let intensity = c.intensity;
  if (p !== VOID_PLACE && Math.random() < 0.0025){
    intensity = 1;
    const line = document.createElement('div');
    line.className = 'prose fade extreme';
    line.innerHTML = 'The needle has gone past the end of the dial and stopped there. ' +
      'This reading is not within the range the instrument was built for and the almanac ' +
      'is printing it unaltered, because it does not have a procedure for not printing it.';
    $('report').appendChild(line);
    const led = $('report').querySelector('.ledger');
    if (led){
      led.innerHTML += '<dt>advisory</dt><dd>do not go outside on the strength of this</dd>';
    }
  }
  setNeedle(intensity);
  setEffect(c.effect);
}

/* ------------------------------ boot -------------------------------- */
sizeCanvas();
tintTop.innerHTML = gradientFor('calm');
tintTop.classList.add('on');

renderPlaces();
roll();
applyMotionPref();

$('go').addEventListener('click', roll);
$('surprise').addEventListener('click', surpriseMe);

window.addEventListener('resize', () => {
  // resize() re-seeds the field for the new size on its own
  sizeCanvas();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopLoop(); else startLoop();
});
motionQuery.addEventListener('change', (e) => {
  reduceMotion = e.matches;
  applyMotionPref();
});
</script>
<script>
window.__almanac = {
  places: () => PLACES.map(p => p.name),
  visitAll: () => { PLACES.slice().forEach(p => { current = p; noteVisit(p); }); return PLACES.length; },
  voidFound: () => voidFound,
  goVoid: () => { current = PLACES[PLACES.length - 1]; renderPlaces(); roll(); return $('report').innerText; },
  forceExtreme: () => {
    const r = Math.random; Math.random = () => 0.0001;
    try { roll(); } finally { Math.random = r; }
    return $('report').innerText;
  }
};
</script>
