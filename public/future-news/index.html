<style>
/* Declare the scheme this toy is actually drawn in. Without it a browser
   running forced dark mode will invert the whole page — the cream card
   comes back dark brown, the ink comes back pale, and the illustrated
   background is flattened to black. */
:root{ color-scheme: dark; }
:root{
  --paper:#E8EDE5;
  --paper-2:#DDE4D9;
  --ink:#1A1D19;
  --ink-2:#414A3F;
  --dim:#78826F;
  --teal:#155E52;
  --rule:#B9C4B3;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--serif);
  min-height:100vh;padding:26px 18px 60px;
}
.paper{ max-width:840px;margin:0 auto }

/* ---------- masthead ---------- */
.mast{ text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px }
.mast .over{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);
}
.mast h1{
  margin:6px 0 4px;font-size:clamp(34px,8vw,64px);font-weight:400;font-style:italic;
  letter-spacing:-.02em;line-height:.96;
}
.mast .rule-line{
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);
  border-top:1px solid var(--rule);margin-top:9px;padding-top:8px;
}

/* ---------- lead ---------- */
.lead{ padding:24px 0 20px;border-bottom:1px solid var(--rule) }
.chip{
  display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.17em;
  text-transform:uppercase;color:var(--teal);border:1px solid var(--teal);padding:3px 8px;margin-bottom:11px;
}
.lead h2{
  margin:0 0 11px;font-size:clamp(26px,6.2vw,48px);font-weight:700;line-height:1.06;letter-spacing:-.025em;
}
.lead .stand{ margin:0;font-size:17px;line-height:1.62;color:var(--ink-2);max-width:58ch }
.lead .byline{
  margin-top:13px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;
}

/* ---------- columns ---------- */
.cols{
  padding:20px 0 0;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:0;
}
.story{ padding:0 20px 20px;border-right:1px solid var(--rule) }
.story:last-child{ border-right:0 }
@media (max-width:640px){ .story{ border-right:0;border-bottom:1px solid var(--rule);padding:0 0 18px;margin-bottom:18px } .story:last-child{ border-bottom:0 } }
.story:first-child{ padding-left:0 }
.story h3{ margin:0 0 7px;font-size:18px;font-weight:700;line-height:1.24;letter-spacing:-.012em }
.story p{ margin:0;font-size:14px;line-height:1.58;color:var(--ink-2) }
.story .k{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);display:block;margin-bottom:6px;
}

/* ---------- sidebar strip ---------- */
.strip{
  margin-top:22px;border-top:3px double var(--ink);border-bottom:1px solid var(--rule);
  padding:14px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;
}
.strip div{ font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.6 }
.strip div b{ display:block;font-family:var(--serif);font-size:15px;color:var(--ink);font-weight:700;margin-top:3px }

.deck{ display:flex;gap:9px;flex-wrap:wrap;margin-top:22px }
.btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border:0;padding:12px 18px;cursor:pointer;font-weight:700;
}
.btn:hover{ background:#000 }
.btn.sec{ background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:400 }
.btn.sec:hover{ border-color:var(--teal);color:var(--teal) }
.btn:focus-visible{ outline:2px solid var(--teal);outline-offset:2px }

footer{
  max-width:840px;margin:26px auto 0;padding-top:14px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.8;
}
footer a{ color:var(--ink-2) }

/* ---------- the rig the sheet is read on ---------- */
:root{
  --shell:#0B0F14;
  --shell-2:#121821;
  --glow:#7FE3D0;
  --rail:#5B6B78;
}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #16202B 0%, transparent 60%),
    var(--shell);
  color:var(--ink);padding:20px 16px 54px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(127,227,208,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(127,227,208,.045) 1px, transparent 1px);
  background-size:44px 44px;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%);
}
.rig{ max-width:880px;margin:0 auto;position:relative;z-index:1 }

.rail{
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--rail);padding:0 4px 9px;
}
.rail-sp{ flex:1 }
.rail .dot{
  width:6px;height:6px;border-radius:50%;background:var(--glow);
  box-shadow:0 0 8px var(--glow);animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
.rail .bars{ display:inline-flex;gap:2px;align-items:flex-end;height:10px }
.rail .bars i{ width:3px;background:var(--glow);opacity:.55 }
.rail .bars i:nth-child(1){ height:3px } .rail .bars i:nth-child(2){ height:5px }
.rail .bars i:nth-child(3){ height:7px } .rail .bars i:nth-child(4){ height:10px;opacity:.25 }

.sheet{
  position:relative;overflow:hidden;
  background:var(--paper);
  box-shadow:0 0 0 1px rgba(127,227,208,.22), 0 0 44px rgba(127,227,208,.09), 0 26px 70px rgba(0,0,0,.6);
}
/* crop marks, so the sheet reads as something retrieved rather than printed */
.sheet::before, .sheet::after{
  content:"";position:absolute;width:13px;height:13px;pointer-events:none;z-index:2;
  border-color:rgba(21,94,82,.5);border-style:solid;
}
.sheet::before{ left:7px;top:7px;border-width:1px 0 0 1px }
.sheet::after{ right:7px;bottom:7px;border-width:0 1px 1px 0 }
.paper{
  max-width:none;margin:0;padding:26px 26px 24px;position:relative;z-index:1;
  background-image:repeating-linear-gradient(0deg, rgba(26,29,25,.028) 0 1px, transparent 1px 3px);
}
.scan{
  position:absolute;left:0;right:0;top:0;height:34%;z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(180deg, transparent, rgba(127,227,208,.28), rgba(255,255,255,.5), transparent);
}
.sheet.printing .scan{ animation:sweep .9s ease-out 1 }
@keyframes sweep{
  0%{ opacity:.9;transform:translateY(-40%) } 100%{ opacity:0;transform:translateY(320%) }
}

/* ---------- ticker ---------- */
.ticker-rail{
  margin-top:0;border-top:1px solid rgba(127,227,208,.2);
  background:var(--shell-2);overflow:hidden;padding:9px 0;
}
.ticker{ display:flex;width:max-content;animation:slide 46s linear infinite }
.tick-run{ display:flex }
.tick-run i{
  font-family:var(--mono);font-style:normal;font-size:10.5px;letter-spacing:.05em;
  color:#8FA3AE;white-space:nowrap;padding:0 26px;position:relative;
}
.tick-run i::after{
  content:"";position:absolute;right:0;top:3px;bottom:3px;width:1px;background:rgba(127,227,208,.25);
}
@keyframes slide{ from{ transform:translateX(0) } to{ transform:translateX(-50%) } }

.deck{ margin-top:18px }
.btn{ background:var(--glow);color:#08120F }
.btn:hover{ background:#A6F0E1 }
.btn.sec{
  background:rgba(255,255,255,.04);color:#C7D6DD;border:1px solid rgba(127,227,208,.3);
}
.btn.sec:hover{ border-color:var(--glow);color:var(--glow);background:rgba(127,227,208,.08) }
.btn:focus-visible{ outline:2px solid var(--glow);outline-offset:3px }

footer{
  position:relative;z-index:1;max-width:880px;border-top:1px solid rgba(127,227,208,.18);
  color:#6E808C;
}
footer a{ color:#9FD8CB }

@media (prefers-reduced-motion: reduce){
  .rail .dot{ animation:none;opacity:.8 }
  .ticker{ animation:none;width:100% }
  .tick-run:nth-child(2){ display:none }
  .sheet.printing .scan{ animation:none;opacity:0 }
}

/* ---------- shared: back to the cabinet ----------
   Every toy carries the same control in the same place, so there is always
   one way out that does not depend on scrolling to a footer. It sits as a
   compact disc and opens to the word on hover or focus, because a wide
   permanent chip covers whatever is in the corner of a scrolling page. */
#lc-back{
  position:fixed;left:14px;bottom:14px;z-index:9999;
  display:inline-flex;align-items:center;gap:0;overflow:hidden;
  font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  color:#F4F5F6;background:rgba(18,19,22,.82);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  width:38px;height:38px;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:width .18s ease, background .16s, border-color .16s, gap .18s ease;
}
#lc-back .a{ font-size:15px;line-height:1;flex:0 0 auto }
#lc-back .w{ max-width:0;opacity:0;transition:max-width .18s ease, opacity .14s ease }
#lc-back:hover, #lc-back:focus-visible{
  width:118px;gap:9px;background:rgba(18,19,22,.96);border-color:rgba(255,255,255,.6);
}
#lc-back:hover .w, #lc-back:focus-visible .w{ max-width:80px;opacity:1 }
#lc-back:focus-visible{ outline:2px solid #7FD8FF;outline-offset:3px }
/* so the foot of a page can always scroll clear of it */
body{ padding-bottom:64px }
@media (max-width:520px){ #lc-back{ left:10px;bottom:10px } }
@media print{ #lc-back{ display:none } }
@media (prefers-reduced-motion: reduce){ #lc-back{ transition:none } }
</style>
</head>

<a id="lc-back" href="/" aria-label="Back to the cabinet"><span class="a" aria-hidden="true">←</span><span class="w">cabinet</span></a>

</div>

<footer>

/* ---------- template fill ----------
   Slots are filled once per headline, with a memo so that {org} and {Org} in
   the same line refer to the same body, while {org2} is guaranteed to be a
   different one. Capitalised slot names capitalise the value. */
function ordinal(n){
  const words = ['zeroth','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth',
    'tenth','eleventh','twelfth','thirteenth','fourteenth','fifteenth','sixteenth','seventeenth',
    'eighteenth','nineteenth','twentieth'];
  return words[n] || (n + 'th');
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function fillTemplate(tpl, year){
  const memo = {};
  const other = (poolName, pool) => {
    let v, guard = 0;
    do { v = pick(pool); } while (v === memo[poolName] && guard++ < 20);
    return v;
  };
  const value = (key) => {
    switch (key){
      case 'org':   return memo.org   || (memo.org   = pick(ORG));
      case 'org2':  return memo.org2  || (memo.org2  = (memo.org ? other('org', ORG) : pick(ORG)));
      case 'thing': return memo.thing || (memo.thing = pick(THING));
      case 'thing2':return memo.thing2|| (memo.thing2= (memo.thing ? other('thing', THING) : pick(THING)));
      case 'place': return memo.place || (memo.place = pick(PLACE));
      case 'place2':return memo.place2|| (memo.place2= (memo.place ? other('place', PLACE) : pick(PLACE)));
      case 'role':  return memo.role  || (memo.role  = pick(ROLE));
      case 'event': return memo.event || (memo.event = pick(EVENT));
      case 'adj':   return memo.adj   || (memo.adj   = pick(ADJ));
      case 'verb':  return memo.verb  || (memo.verb  = pick(VERB_PHRASE));
      case 'vbase': return memo.vbase || (memo.vbase = pick(BASE_VERB));
      case 'verb2': return memo.verb2 || (memo.verb2 = (memo.verb ? other('verb', VERB_PHRASE) : pick(VERB_PHRASE)));
      case 'n':     return String(ri(4, 90));
      case 'N':     return String(ri(4, 96));
      case 'n2':    return String(ri(2, 41));
      case 'nth':   return ordinal(ri(3, 20));
      // a year in the edition's own past, so a century-hence paper still
      // refers backwards rather than to something that has not happened
      case 'yr':    return String(year - ri(8, 62));
      default:      return key;
    }
  };
  return tpl.replace(/\{(\w+)\}/g, (m, key) => {
    const lower = key.charAt(0).toLowerCase() + key.slice(1);
    const isCap = key !== lower && key !== key.toUpperCase();
    const v = value(isCap ? lower : key);
    return isCap ? cap(v) : v;
  });
}

function futureDate(){
  const d = new Date();
  d.setFullYear(d.getFullYear() + yearOffset);
  return d;
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function headline(year){ return fillTemplate(pick(HEADLINES), year); }

let sweepTimer = null;
function sweep(){
  // the "printing" pass: a light band crosses the sheet once per edition
  if (REDUCED) return;
  const el = $('sheet');
  el.classList.remove('printing');
  void el.offsetWidth;            // restart the animation
  el.classList.add('printing');
  clearTimeout(sweepTimer);
  sweepTimer = setTimeout(() => el.classList.remove('printing'), 900);
}

function renderTicker(year){
  const items = shuffle(TICKER).slice(0, 8).map(t => fillTemplate(t, year));
  // duplicated so the marquee can loop without a visible seam
  $('ticker').innerHTML = [0,1].map(() =>
    '<span class="tick-run">' + items.map(t => '<i>' + esc(t) + '</i>').join('') + '</span>'
  ).join('');
}

function render(){
  const d = futureDate();
  const year = d.getFullYear();
  $('dateline').textContent = d.toLocaleDateString('en-GB',
    { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  $('edition').textContent = 'edition ' + ri(9000, 99999) + ' · ' + yearOffset + ' years hence';
  $('retrieval').textContent = 'archive retrieval ' + ri(100000,999999) + '/' + year;
  $('integrity').textContent = ri(72, 99) + '% legible';

  $('lead').innerHTML =
    '<span class="chip">' + esc(pick(SECTIONS)) + ' · lead</span>' +
    '<h2>' + esc(headline(year)) + '</h2>' +
    '<p class="stand">' + esc(pick(STANDFIRST)) + '</p>' +
    '<div class="byline">' + esc(pick(REPORTERS)) + ' · filed from ' + esc(pick(FILED_FROM)) + '</div>';

  // three shorts, built from the same engine but never repeating the lead's shape
  const used = new Set();
  const shorts = [];
  while (shorts.length < 3){
    const tpl = pick(HEADLINES);
    if (used.has(tpl)) continue;
    used.add(tpl);
    shorts.push([pick(SECTIONS), fillTemplate(tpl, year), pick(SHORT_BODY)]);
  }
  $('cols').innerHTML = shorts.map(s =>
    '<div class="story"><span class="k">' + esc(s[0]) + '</span>' +
    '<h3>' + esc(s[1]) + '</h3><p>' + esc(s[2]) + '</p></div>').join('');

  const strip = [pick(CONDITIONS), pick(INDEX), pick(MOOD), pick(TIDE)];
  $('strip').innerHTML = strip.map(s =>
    '<div>' + esc(s[0]) + '<b>' + esc(s[1]) + '</b></div>').join('');

  renderTicker(year);
  sweep();
}

$('next').addEventListener('click', render);
$('far').addEventListener('click', () => { yearOffset += 100; render(); });
