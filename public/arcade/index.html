<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Arcade Cabinet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%230B0C14'/><rect x='5' y='6' width='22' height='15' fill='%232E6FB8'/><rect x='8' y='9' width='4' height='4' fill='%23F5D06B'/><rect x='16' y='13' width='4' height='4' fill='%23E23B52'/><rect x='11' y='24' width='10' height='3' fill='%236E7BA8'/></svg>">
<style>
:root{ color-scheme: dark; }
:root{
  --ink:#0B0C14; --slate:#232741; --steel:#3E4A73; --haze:#6E7BA8;
  --bone:#C3CBE6; --gold:#F5D06B; --violet:#8A5BC7;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:#07080D;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(138,91,199,.16), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 1px, transparent 1px 4px);
  color:var(--bone);font-family:var(--mono);font-size:12px;
  display:flex;flex-direction:column;align-items:center;
  padding:14px 8px 84px;-webkit-user-select:none;user-select:none;
  overflow-x:hidden;
}

/* ---------- shared: back to the cabinet ---------- */
#lc-back{
  position:fixed;left:14px;bottom:14px;z-index:9999;
  display:inline-flex;align-items:center;gap:0;overflow:hidden;
  font:600 11px/1 var(--mono);
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  color:#F4F5F6;background:rgba(18,19,22,.82);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  width:38px;height:38px;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:width .18s ease, background .16s, border-color .16s, gap .18s ease;
}
#lc-back .a{ font-size:15px;line-height:1;flex:0 0 auto }
#lc-back .w{ max-width:0;opacity:0;transition:max-width .18s ease, opacity .14s ease }
#lc-back:hover, #lc-back:focus-visible{
  width:118px;gap:9px;background:rgba(18,19,22,.96);border-color:rgba(255,255,255,.6);
}
#lc-back:hover .w, #lc-back:focus-visible .w{ max-width:80px;opacity:1 }
#lc-back:focus-visible{ outline:2px solid #7FD8FF;outline-offset:3px }
@media (prefers-reduced-motion: reduce){ #lc-back{ transition:none } }

/* ---------- the cabinet ---------- */
.marquee{
  font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--haze);
  margin:0 0 10px;text-align:center;
}
#cab{
  position:relative;
  padding:12px;border-radius:10px;
  background:linear-gradient(180deg,#171A2B,#0E1019);
  border:1px solid #2A3050;
  box-shadow:0 0 0 3px #0A0B12, 0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
}
.bezel{ position:relative;line-height:0;border-radius:6px;overflow:hidden;background:#000 }
#screen{
  display:block;image-rendering:pixelated;image-rendering:crisp-edges;
  background:#0B0C14;
}
/* The CRT treatment: applied once, here, so every game inherits it. */
#crt{
  position:absolute;left:0;top:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,
      rgba(0,0,0,.30) 0px, rgba(0,0,0,.30) 1px,
      rgba(0,0,0,0) 1px,  rgba(0,0,0,0) 3px),
    repeating-linear-gradient(to right,
      rgba(255,0,60,.045) 0px, rgba(0,255,160,.045) 1px, rgba(60,120,255,.045) 2px);
  box-shadow:
    inset 0 0 44px rgba(0,0,0,.55),
    inset 0 0 130px rgba(0,0,0,.75);
  border-radius:10px;
}
#crt::after{
  content:"";position:absolute;inset:0;border-radius:10px;
  background:radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.055), transparent 55%);
}
@media (prefers-reduced-motion: no-preference){
  #crt{ animation:flick 5.5s steps(1) infinite }
  @keyframes flick{ 0%,97%{opacity:1} 98%{opacity:.93} 99%{opacity:1} }
}

.legend{
  margin:12px 0 0;text-align:center;color:var(--steel);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;line-height:1.9;
}
.legend b{ color:var(--haze);font-weight:600 }

/* ---------- touch controls ---------- */
.pad{ display:none;position:fixed;left:0;right:0;bottom:0;padding:10px 14px 16px;
      justify-content:space-between;align-items:flex-end;z-index:50;
      background:linear-gradient(0deg,rgba(7,8,13,.96),rgba(7,8,13,0)) }
.dpad{ display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px }
.btns{ display:flex;gap:10px;align-items:center }
.pad button{
  background:#1A1F35;border:1px solid #333B60;color:var(--bone);
  border-radius:6px;font:600 13px/1 var(--mono);
}
.pad button:active{ background:var(--violet);color:#0B0C14 }
.round{ width:54px;height:54px;border-radius:50% !important }
.pad .sm{ width:auto;padding:0 12px;height:32px;font-size:9px;letter-spacing:.12em }
@media (pointer:coarse){ .pad{ display:flex } body{ padding-bottom:150px } }
</style>
</head>
<body>
<a id="lc-back" href="/" aria-label="Back to the cabinet"><span class="a" aria-hidden="true">&#8592;</span><span class="w">cabinet</span></a>

<p class="marquee">Insert nothing &middot; Play forever</p>

<div id="cab">
  <div class="bezel">
    <canvas id="screen" width="320" height="240" aria-label="Arcade screen"></canvas>
    <div id="crt"></div>
  </div>
</div>

<p class="legend">
  <b>Arrows</b> or <b>WASD</b> move &nbsp;·&nbsp; <b>Z</b> / <b>Space</b> fire &nbsp;·&nbsp;
  <b>X</b> second button<br>
  <b>Enter</b> pause &nbsp;·&nbsp; <b>Esc</b> back to the game select
</p>

<div class="pad">
  <div class="dpad">
    <span></span><button data-k="up" aria-label="Up">&#9650;</button><span></span>
    <button data-k="left" aria-label="Left">&#9664;</button>
    <button data-k="down" aria-label="Down">&#9660;</button>
    <button data-k="right" aria-label="Right">&#9654;</button>
    <span></span><span></span><span></span>
  </div>
  <div class="btns">
    <button class="sm" data-k="back">ESC</button>
    <button class="sm" data-k="start">P</button>
    <button class="round" data-k="b" aria-label="B">X</button>
    <button class="round" data-k="a" aria-label="A">Z</button>
  </div>
</div>

<!-- Matter.js: already an approved dependency in this hub (the gratitude jar
     and the rhythm sequencer both use it). Billiards degrades to a notice
     if the CDN is unreachable; nothing else depends on it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="/shared/lc-id.js"></script>
<script src="engine.js"></script>
<script src="games/snake.js"></script>
<script src="games/pong.js"></script>
<script src="games/breakout.js"></script>
<script src="games/invaders.js"></script>
<script src="games/asteroids.js"></script>
<script src="games/simon.js"></script>
<script src="games/mines.js"></script>
<script src="games/pentomino.js"></script>
<script src="games/stacker.js"></script>
<script src="games/digger.js"></script>
<script src="games/mazechase.js"></script>
<script src="games/billiards.js"></script>
<script src="games/platformer.js"></script>
<script src="games/racer.js"></script>
<script>ARCADE.boot();</script>
</body>
</html>
