<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231A1A22'/><circle cx='16' cy='16' r='8' fill='none' stroke='%23E0C36A' stroke-width='2'/><circle cx='16' cy='16' r='2' fill='%23E0C36A'/></svg>">
<style>
:root{ color-scheme: light; }
*{ box-sizing:border-box }
html,body{ margin:0;padding:0 }

/* ------------------------------------------------------------------ *
 *  The shell owns almost nothing on purpose.
 *
 *  Every voice in here was its own drawer before this, and each one had
 *  a room built for it — the pegboard workbench, the green CRT, the
 *  ruled biro note, the memo in triplicate. Merging them into one toy
 *  was only worth doing if none of that was lost, so a voice still
 *  brings its own palette, its own type, its own surround and its own
 *  renderer. What the shell provides is the door between them.
 *
 *  So there is no shell palette. The bar below reads its colours from
 *  whichever room is currently up, through custom properties the voice
 *  sets. Change voice and the whole page changes with it.
 * ------------------------------------------------------------------ */
body{
  min-height:100vh;
  background:var(--gen-bg,#15151b);
  color:var(--gen-ink,#e8e6df);
  font-family:var(--gen-body,ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif);
  transition:background-color .5s ease,color .5s ease;
}

/* ---- the door ---- */
#shell-bar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;
  background:var(--gen-bar,rgba(0,0,0,.30));
  border-bottom:1px solid var(--gen-rule,rgba(255,255,255,.14));
  backdrop-filter:blur(7px);
}
#shell-bar .lab{
  font:600 10.5px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:.17em;text-transform:uppercase;opacity:.6;flex:none;
}
#shell-pick{
  font:inherit;font-size:13px;padding:7px 10px;min-height:34px;
  background:var(--gen-field,rgba(255,255,255,.07));
  color:inherit;border:1px solid var(--gen-rule,rgba(255,255,255,.20));
  border-radius:3px;cursor:pointer;max-width:min(320px,60vw);
}
#shell-blurb{ flex:1 1 240px;min-width:0;font-size:12px;opacity:.66;line-height:1.45 }
@media (pointer:coarse){ #shell-pick{ min-height:44px } }

/* ---- where a voice lives ---- */
#shell-room{ padding:26px 18px 90px }
#shell-room > .room{ max-width:760px;margin:0 auto }

/* A voice that has not loaded is a fact to state, not a blank page. */
#shell-room .shell-missing{
  max-width:620px;margin:60px auto;padding:18px 20px;line-height:1.6;
  border:1px solid var(--gen-rule,rgba(255,255,255,.20));border-radius:4px;
}
@media (prefers-reduced-motion: reduce){
  body{ transition:none }
}
</style>
</head>
<body>

<div id="shell-bar">
  <span class="lab">Voice</span>
  <select id="shell-pick" aria-label="Which voice"></select>
  <p id="shell-blurb"></p>
</div>

<main id="shell-room" aria-live="polite"></main>

<script src="/shared/lc-commons.js"></script>
<script src="/shared/lc-audio.js"></script>
<script src="/shared/lc-sound.js"></script>
<script src="/shared/lc-achievements.js"></script>
<script src="/shared/lc-generate.js"></script>

<script src="/shared/lc-shell.js"></script>
<script>
/* The registry and the door between parts are /shared/lc-shell.js now,
   because the Design Studio, the Sound Lab and the History Desk are the
   same shape as this and there is no reason for four copies of it.

   LCGen.voice() is kept as the name the voice files already call, so
   fifteen modules did not have to be edited to move one function. */
window.LCGen = (function () {
  'use strict';
  var S = LCShell.create({ key: 'lc-generator-voice', param: 'voice', title: 'The Generator' });
  return {
    voice: S.add, show: S.show, boot: S.boot,
    get voices() { return S.parts; },
    get current() { return S.current; },
  };
})();
</script>

<!-- Voices. Each one is a former drawer; adding another is one line. -->
<script src="/generator/voices/excuse.js"></script>
<script src="/generator/voices/corkboard.js"></script>
<script src="/generator/voices/seedround.js"></script>
<script src="/generator/voices/memo.js"></script>
<script src="/generator/voices/wiki.js"></script>
<script src="/generator/voices/tvvoice.js"></script>
<script src="/generator/voices/loadout.js"></script>
<script src="/generator/voices/briefing.js"></script>
<script src="/generator/voices/advisor.js"></script>
<script src="/generator/voices/shipslog.js"></script>
<script src="/generator/voices/apparition.js"></script>
<script src="/generator/voices/gun.js"></script>
<script src="/generator/voices/coldopen.js"></script>
<!-- the shanty keeps its own verse engine, which was a sibling file -->
<script src="/generator/voices/shanty-verse.js"></script>
<script src="/generator/voices/shanty.js"></script>
<script src="/generator/voices/nonsense.js"></script>

<script>LCGen.boot();</script>
</body>
</html>
