<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Five Operating Systems</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23177D8C'/><rect x='5' y='7' width='22' height='16' rx='1' fill='%23C9C9C9' stroke='%23222'/><rect x='5' y='7' width='22' height='4' fill='%23202F6B'/></svg>">
<style>
:root{ color-scheme: light; }

/* ---- the five looks ------------------------------------------------
   Each era is a set of variables plus a body class. Nothing here traces
   a real logo or ships a real system font; these are the conventions of
   the period — bevel direction, title-bar placement, palette — rebuilt.
   -------------------------------------------------------------------*/
:root{
  --desk:#177D8C;
  --deskpat:none;
  --win:#C9C9C9;
  --win-ink:#111;
  --title:#1F2F6B;
  --title-ink:#FFF;
  --title-h:22px;
  --face:#C9C9C9;
  --hi:#FFFFFF;
  --lo:#7A7A7A;
  --lo2:#3D3D3D;
  --radius:0px;
  --bar-h:34px;
  --font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ui-size:12px;
  --accent:#1F2F6B;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--desk);font-family:var(--font);font-size:var(--ui-size);color:var(--win-ink);
  -webkit-user-select:none;user-select:none;
}
#desk{ position:absolute;inset:0;background-image:var(--deskpat) }

/* bevels, the way each era did them */
.bevel-out{ border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);background:var(--face) }
.bevel-in{ border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);background:#fff }

/* ---- windows ---- */
.win{
  position:absolute;min-width:210px;background:var(--win);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);
}
.win.active{ z-index:40 }
.win .tb{
  height:var(--title-h);background:var(--title);color:var(--title-ink);
  display:flex;align-items:center;gap:6px;padding:0 5px;cursor:grab;flex:0 0 auto;
  font-weight:700;letter-spacing:.02em;
}
.win .tb .t{ flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(var(--ui-size) - .5px) }
.win .tb button{
  width:16px;height:15px;line-height:1;padding:0;cursor:pointer;font-size:10px;font-weight:700;
  border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);background:var(--face);color:#111;
  font-family:var(--font);
}
.win .body{ flex:1 1 auto;overflow:auto;padding:9px;background:var(--win);min-height:0 }
.win.paper .body{ background:#fff;padding:0 }

textarea, .listing{
  width:100%;height:100%;border:0;outline:0;resize:none;background:#fff;color:#111;
  font-family:var(--font);font-size:var(--ui-size);padding:8px;line-height:1.55;
}
.listing{ overflow:auto }
.listing .row{ display:flex;gap:8px;padding:3px 5px;cursor:default;align-items:center }
.listing .row:hover{ background:var(--accent);color:#fff }
.listing .row .n{ flex:1 }
.listing .row .s{ opacity:.7;font-size:calc(var(--ui-size) - 1px) }

.btnrow{ display:flex;gap:7px;margin-top:10px;justify-content:flex-end }
button.b{
  font-family:var(--font);font-size:var(--ui-size);padding:5px 13px;cursor:pointer;
  border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);background:var(--face);color:#111;
  border-radius:var(--radius);
}
button.b:active{ border-color:var(--lo2) var(--hi) var(--hi) var(--lo2) }
button.b:focus-visible, .win .tb button:focus-visible{ outline:2px solid #FF0;outline-offset:1px }

/* ---- the menu nobody mentions ---- */
#ctx{
  position:fixed;z-index:9998;min-width:186px;
  background:#C8C8C8;color:#101010;
  border:1px solid #101010;
  box-shadow:inset 1px 1px 0 #FFF, inset -1px -1px 0 #7A7A7A, 2px 2px 0 rgba(0,0,0,.4);
  padding:3px;font-family:Tahoma,Geneva,Verdana,sans-serif;font-size:12px;
  user-select:none;
}
#ctx[hidden]{ display:none }
#ctx button{
  display:block;width:100%;text-align:left;background:transparent;border:0;
  padding:5px 22px 5px 12px;font:inherit;color:inherit;cursor:default;
}
#ctx button:hover:not(:disabled){ background:#000080;color:#FFF }
#ctx button:disabled{ color:#8A8A8A }
#ctx hr{ border:0;border-top:1px solid #8A8A8A;border-bottom:1px solid #FFF;margin:3px 2px }
#ctxbox{
  position:fixed;z-index:9999;left:50%;top:42%;transform:translate(-50%,-50%);
  background:#C8C8C8;color:#101010;border:1px solid #101010;
  box-shadow:inset 1px 1px 0 #FFF, inset -1px -1px 0 #7A7A7A, 4px 4px 0 rgba(0,0,0,.45);
  font-family:Tahoma,Geneva,Verdana,sans-serif;font-size:12px;width:min(330px,88vw);
}
#ctxbox[hidden]{ display:none }
#ctxbox .tb{ background:linear-gradient(90deg,#000080,#1084D0);color:#FFF;font-weight:700;padding:3px 6px;font-size:11px }
#ctxbox .bd{ padding:18px 16px;line-height:1.55 }
#ctxbox .ft{ padding:0 16px 14px;text-align:center }
#ctxbox .ft button{
  font:inherit;background:#C8C8C8;border:1px solid #101010;
  box-shadow:inset 1px 1px 0 #FFF, inset -1px -1px 0 #7A7A7A;
  padding:5px 22px;cursor:pointer;
}

/* ---- desktop icons ---- */
#icons{ position:absolute;top:10px;left:10px;width:96px;display:flex;flex-direction:column;gap:14px;z-index:5 }
.icon{ text-align:center;cursor:pointer;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6) }
.icon .g{ width:34px;height:34px;margin:0 auto 4px }
.icon span{ font-size:calc(var(--ui-size) - 1px);line-height:1.3;display:inline-block;padding:1px 3px }
.icon.sel span{ background:var(--accent);color:#fff }

/* ---- the bar ---- */
#bar{
  position:absolute;left:0;right:0;height:var(--bar-h);z-index:60;
  background:var(--face);display:flex;align-items:center;gap:6px;padding:0 6px;
  border-top:2px solid var(--hi);
  bottom:0;
}
#bar.top{ top:0;bottom:auto;border-top:0;border-bottom:2px solid var(--lo2) }
#start{
  font-family:var(--font);font-weight:700;font-size:var(--ui-size);padding:5px 12px;cursor:pointer;
  border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);background:var(--face);color:#111;
  border-radius:var(--radius);
}
#tasks{ flex:1;display:flex;gap:5px;overflow:hidden }
#tasks button{
  font-family:var(--font);font-size:calc(var(--ui-size) - .5px);padding:4px 9px;cursor:pointer;max-width:150px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);background:var(--face);color:#111;
  border-radius:var(--radius);
}
#clock{
  padding:5px 10px;border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);
  background:var(--face);font-size:calc(var(--ui-size) - .5px);border-radius:var(--radius);
}
#menu{
  position:absolute;z-index:100;min-width:190px;display:none;
  border:2px solid;border-color:var(--hi) var(--lo2) var(--lo2) var(--hi);background:var(--face);
  border-radius:var(--radius);padding:3px;
}
#menu.open{ display:block }
#menu .mi{ padding:7px 12px;cursor:pointer;display:flex;gap:9px;align-items:center }
#menu .mi:hover{ background:var(--accent);color:#fff }
#menu .sep{ height:2px;background:var(--lo);margin:3px 2px;opacity:.4 }
#menu .head{
  padding:6px 12px;font-weight:700;opacity:.6;font-size:calc(var(--ui-size) - 1px);
  text-transform:uppercase;letter-spacing:.1em;
}

/* ---- era 1: 1984, one bit -------------------------------------- */
body.e84{
  --desk:#8A8A8A;
  --deskpat:repeating-conic-gradient(#FFF 0% 25%, #000 0% 50%);
  --win:#FFFFFF; --face:#FFFFFF; --win-ink:#000;
  --title:#FFFFFF; --title-ink:#000; --title-h:19px;
  --hi:#000; --lo:#000; --lo2:#000;
  --accent:#000; --radius:0px; --ui-size:12px;
  --shadow:2px 2px 0 #000;
}
body.e84 #desk{ background-size:4px 4px;opacity:1 }
body.e84 .win{ border:2px solid #000 }
body.e84 .win .tb{
  border-bottom:2px solid #000;
  background:repeating-linear-gradient(180deg,#000 0 1px,#fff 1px 3px);
  justify-content:center;
}
body.e84 .win .tb .t{ background:#fff;padding:0 8px;flex:0 1 auto;text-align:center;font-weight:700 }
body.e84 .win .tb button{ border:2px solid #000;background:#fff }
body.e84 .icon{ color:#000;text-shadow:none }
body.e84 .icon span{ background:#fff;border:1px solid #000 }
body.e84 #bar{ border-bottom:2px solid #000;border-top:0 }
body.e84 button.b, body.e84 #start, body.e84 #tasks button, body.e84 #clock{
  border:2px solid #000;background:#fff;border-radius:9px;
}
body.e84 #menu{ border:2px solid #000;box-shadow:2px 2px 0 #000 }

/* ---- era 2: 1991, beige and bevelled ---------------------------- */
body.e91{
  --desk:#008080; --deskpat:none;
  --win:#C0C0C0; --face:#C0C0C0; --win-ink:#000;
  --title:#000080; --title-ink:#FFF; --title-h:20px;
  --hi:#FFFFFF; --lo:#808080; --lo2:#404040;
  --accent:#000080; --radius:0px; --ui-size:12px;
}

/* ---- era 3: 1995, the bar arrives -------------------------------- */
body.e95{
  --desk:#3A6EA5; --deskpat:none;
  --win:#C0C0C0; --face:#C0C0C0; --win-ink:#000;
  --title:linear-gradient(90deg,#000080,#1084D0); --title-ink:#FFF; --title-h:21px;
  --hi:#FFFFFF; --lo:#808080; --lo2:#404040;
  --accent:#000080; --radius:0px; --ui-size:12px;
}

/* ---- era 4: 2001, gradients and rounded corners ------------------ */
body.e01{
  --desk:#5B9E4A;
  --deskpat:radial-gradient(120% 80% at 50% 120%, #7FC15E 0%, #3E7C46 45%, #2B5E8F 100%);
  --win:#ECE9D8; --face:#ECE9D8; --win-ink:#111;
  --title:linear-gradient(180deg,#3F8CE8,#1B54C4 52%,#2E6FDA); --title-ink:#FFF; --title-h:27px;
  --hi:#FFFFFF; --lo:#A9A28C; --lo2:#8C8672;
  --accent:#316AC5; --radius:7px; --ui-size:12.5px;
  --font:ui-sans-serif,system-ui,"Segoe UI",Tahoma,sans-serif;
  --shadow:0 5px 18px rgba(0,0,0,.32);
  --bar-h:38px;
}
body.e01 #desk{ background-image:var(--deskpat) }
body.e01 .win{ border:1px solid #2255B8;border-radius:8px 8px 3px 3px;overflow:hidden }
body.e01 .win .tb{ border-radius:7px 7px 0 0;padding:0 7px;font-size:13px }
body.e01 .win .tb button{
  border:1px solid rgba(255,255,255,.6);border-radius:4px;background:#D14A32;color:#fff;
  width:19px;height:17px;
}
body.e01 button.b, body.e01 #start, body.e01 #tasks button, body.e01 #clock{
  border:1px solid #9AA7B5;border-radius:4px;background:linear-gradient(180deg,#FDFDFD,#DCE3EC);
}
body.e01 #start{ background:linear-gradient(180deg,#6FBF4F,#3C8B34);color:#fff;border-color:#2F6E2A;font-weight:700;border-radius:0 14px 14px 0 }
body.e01 #bar{ background:linear-gradient(180deg,#3E7BD6,#1E4FA8);border-top:1px solid #6FA0E8 }
body.e01 #clock{ background:#1C4FA0;color:#fff;border-color:#1B4490 }
body.e01 #tasks button{ background:linear-gradient(180deg,#4B87DC,#2C60B8);color:#fff;border-color:#24509C }

/* ---- era 5: 2013, everything goes flat --------------------------- */
body.e13{
  --desk:#E8E6E1;
  --deskpat:linear-gradient(135deg,#F3F1EC 0%,#DEDBD3 100%);
  --win:#FFFFFF; --face:#FFFFFF; --win-ink:#22201C;
  --title:#FFFFFF; --title-ink:#22201C; --title-h:34px;
  --hi:#E6E3DC; --lo:#CFCBC2; --lo2:#E6E3DC;
  --accent:#E4573D; --radius:6px; --ui-size:13px;
  --font:ui-sans-serif,system-ui,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 10px 28px rgba(20,18,15,.14);
  --bar-h:44px;
}
body.e13 #desk{ background-image:var(--deskpat) }
body.e13 .win{ border:1px solid #E0DDD5;border-radius:6px;overflow:hidden }
body.e13 .win .tb{ border-bottom:1px solid #EDEAE3;font-weight:600;padding:0 12px }
body.e13 .win .tb button{ border:0;background:none;color:#8C877E;font-size:13px;width:22px }
body.e13 .win .tb button:hover{ color:var(--accent) }
body.e13 button.b, body.e13 #start, body.e13 #tasks button, body.e13 #clock{
  border:1px solid #E0DDD5;background:#fff;border-radius:5px;color:#22201C;
}
body.e13 #start{ background:var(--accent);color:#fff;border-color:var(--accent) }
body.e13 #bar{ background:#FFFFFF;border-top:1px solid #E4E1DA }
body.e13 .icon{ color:#3A362F;text-shadow:none }
body.e13 .icon.sel span{ background:var(--accent) }
body.e13 #menu{ border:1px solid #E0DDD5;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.16) }

/* ---- the era switcher (not part of any of them) ------------------ */
#switch{
  position:absolute;right:10px;top:10px;z-index:80;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
#switch button{
  font:600 10px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(18,19,22,.78);color:#F2F3F4;border:1px solid rgba(255,255,255,.28);
  padding:8px 10px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);
}
#switch button[aria-pressed="true"]{ background:#F2F3F4;color:#15161A;border-color:#F2F3F4 }
#switch button:focus-visible{ outline:2px solid #7FD8FF;outline-offset:2px }

/* --- touch targets (sweep) --- */
/* A 44px title bar is not a title bar any more, so window chrome settles for a
   close button big enough to hit without wrecking the era it is imitating.
   Everything else in the OS gets the full 44. */
@media (pointer:coarse){
  #start, button{ min-height:44px }
  .win .tb{ min-height:30px }
  .win .tb button{ width:28px;min-height:24px;height:24px;font-size:13px }
}

#lc-back{
  position:absolute;left:10px;bottom:calc(var(--bar-h) + 10px);z-index:90;
  display:inline-flex;align-items:center;gap:0;overflow:hidden;
  font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  letter-spacing:.16em;text-transform:uppercase;text-decoration:none;white-space:nowrap;
  color:#F4F5F6;background:rgba(18,19,22,.82);
  border:1px solid rgba(255,255,255,.3);border-radius:999px;
  width:38px;height:38px;justify-content:center;
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:width .18s ease, background .16s, border-color .16s, gap .18s ease;
}
/* A 38px pill is under the 44px a fingertip needs. */
@media (pointer:coarse){ #lc-back{ width:44px;height:44px } }
#lc-back .a{ font-size:15px;line-height:1;flex:0 0 auto }
#lc-back .w{ max-width:0;opacity:0;transition:max-width .18s ease, opacity .14s ease }
#lc-back:hover, #lc-back:focus-visible{ width:118px;gap:9px;background:rgba(18,19,22,.96);border-color:rgba(255,255,255,.6) }
#lc-back:hover .w, #lc-back:focus-visible .w{ max-width:80px;opacity:1 }
#lc-back:focus-visible{ outline:2px solid #7FD8FF;outline-offset:3px }
@media (prefers-reduced-motion: reduce){ #lc-back{ transition:none } }
</style>
</head>
<body class="e91">
<div id="desk"></div>

<a id="lc-back" href="/" aria-label="Back to the cabinet"><span class="a" aria-hidden="true">←</span><span class="w">cabinet</span></a>

<div id="switch" role="group" aria-label="choose an era"></div>
<div id="icons"></div>

<div id="bar">
  <button id="start">Start</button>
  <div id="tasks"></div>
  <div id="clock">--:--</div>
</div>
<div id="menu" role="menu"></div>

<script src="/shared/lc-achievements.js"></script>
<script>
'use strict';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ------------------------------------------------------------------ *
 * Five invented operating systems, one per era. The conventions are   *
 * the period's — bevel direction, where the bar lives, how a title    *
 * bar is drawn, what colour a desktop was — and the names, logos and  *
 * wallpapers are all made up. Nothing here traces a real mark.        *
 * ------------------------------------------------------------------ */

const ERAS = [
  {
    id:'e84', year:'1984', name:'MONO 1.0',
    bar:'top', start:'≡',
    about:['Processor  ·  8 MHz','Memory  ·  128 K','Display  ·  512 × 342, one bit',
           'Storage  ·  400 K, single sided','Sound  ·  one beep, on request'],
    tagline:'One bit of colour, and it is the only bit you need.',
  },
  {
    id:'e91', year:'1991', name:'TILE 3.1',
    bar:'top', start:'Programs',
    about:['Processor  ·  25 MHz','Memory  ·  4 MB','Display  ·  640 × 480, 16 colours',
           'Storage  ·  80 MB fixed disk','Sound  ·  internal speaker'],
    tagline:'Everything is a rectangle with a bevel on it.',
  },
  {
    id:'e95', year:'1995', name:'PLATE 95',
    bar:'bottom', start:'Start',
    about:['Processor  ·  100 MHz','Memory  ·  16 MB','Display  ·  800 × 600, 256 colours',
           'Storage  ·  1.2 GB','Modem  ·  28.8 kbps, connected'],
    tagline:'The bar moved to the bottom and never moved back.',
  },
  {
    id:'e01', year:'2001', name:'GLASS 5',
    bar:'bottom', start:'go',
    about:['Processor  ·  1.4 GHz','Memory  ·  256 MB','Display  ·  1024 × 768, true colour',
           'Storage  ·  40 GB','Network  ·  broadband, always on'],
    tagline:'Everything is rounded, blue, and slightly wet.',
  },
  {
    id:'e13', year:'2013', name:'FLAT',
    bar:'bottom', start:'menu',
    about:['Processor  ·  2.6 GHz, four of them','Memory  ·  8 GB','Display  ·  retina, whatever that means',
           'Storage  ·  512 GB solid state','Network  ·  wireless, three bars'],
    tagline:'Somebody deleted every gradient and called it progress.',
  },
];

let era = ERAS[1];

/* ---- icons, drawn as inline SVG so nothing traces a real one ------ */

const GLYPHS = {
  disk: (c) => `<svg viewBox="0 0 32 32"><rect x="4" y="4" width="24" height="24" rx="2" fill="${c.f}" stroke="${c.s}" stroke-width="2"/><rect x="10" y="4" width="12" height="10" fill="${c.s}"/><rect x="13" y="6" width="3" height="6" fill="${c.f}"/><rect x="9" y="19" width="14" height="9" fill="${c.b}" stroke="${c.s}"/></svg>`,
  folder: (c) => `<svg viewBox="0 0 32 32"><path d="M3 8h9l3 3h14v16H3z" fill="${c.f}" stroke="${c.s}" stroke-width="2" stroke-linejoin="round"/><path d="M3 14h26" stroke="${c.s}" stroke-width="1.4"/></svg>`,
  note: (c) => `<svg viewBox="0 0 32 32"><path d="M7 3h13l5 5v21H7z" fill="${c.b}" stroke="${c.s}" stroke-width="2" stroke-linejoin="round"/><path d="M20 3v5h5" fill="none" stroke="${c.s}" stroke-width="2"/><path d="M11 14h11M11 18h11M11 22h7" stroke="${c.s}" stroke-width="1.6"/></svg>`,
  paint: (c) => `<svg viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="19" rx="1" fill="${c.b}" stroke="${c.s}" stroke-width="2"/><path d="M7 20l6-8 5 6 3-3 4 5z" fill="${c.f}" stroke="${c.s}" stroke-width="1.4" stroke-linejoin="round"/><circle cx="21" cy="10" r="2.4" fill="${c.f}" stroke="${c.s}" stroke-width="1.2"/></svg>`,
  bin: (c) => `<svg viewBox="0 0 32 32"><path d="M9 10h14l-1.6 18H10.6z" fill="${c.f}" stroke="${c.s}" stroke-width="2" stroke-linejoin="round"/><path d="M6 8h20M13 6h6v2h-6z" stroke="${c.s}" stroke-width="2" fill="${c.f}"/><path d="M14 14v10M18 14v10" stroke="${c.s}" stroke-width="1.4"/></svg>`,
};
function glyphColours(){
  if (era.id === 'e84') return { f:'#fff', s:'#000', b:'#fff' };
  if (era.id === 'e13') return { f:'#E4573D', s:'#3A362F', b:'#fff' };
  if (era.id === 'e01') return { f:'#F0C33C', s:'#2B4F86', b:'#fff' };
  return { f:'#E8D06A', s:'#1A1A1A', b:'#fff' };
}

/* ---- the contents ------------------------------------------------- */

const FILES = [
  { n:'README.TXT', s:'2 K', body:
'Welcome to this computer.\n\n' +
'It has no network card that works, no disk you can fill, and no way\n' +
'to lose anything. Everything you type here is gone the moment you\n' +
'close the tab, which is either a bug or the entire point.\n\n' +
'Try the era buttons in the top right. It is the same machine each\n' +
'time. Only the taste changes.' },
  { n:'NOTES.TXT', s:'1 K', body:
'- ring back about the thing\n' +
'- the OTHER thing\n' +
'- do not reformat C: again\n' +
'- 3.5" disks: buy more\n' +
'- ask someone what a config file is' },
  { n:'LETTER.TXT', s:'3 K', body:
'Dear Sir or Madam,\n\n' +
'Further to your letter of the 14th, I am writing to confirm that the\n' +
'part has arrived, that it is the wrong part, and that I have kept it.\n\n' +
'Yours faithfully,\n' +
'(unsigned)' },
  { n:'AUTOEXEC.BAT', s:'1 K', body:
'@ECHO OFF\n' +
'REM  do not touch this file\n' +
'REM  seriously\n' +
'PATH C:\\;C:\\DOS;C:\\UTILS\n' +
'SET TEMP=C:\\TEMP\n' +
'ECHO Good morning.\n' },
  { n:'HOLIDAY.PIC', s:'46 K', body:null },
  { n:'BUDGET.WKS', s:'12 K', body:null },
];

/* ---- window manager ----------------------------------------------- */

let z = 10, wins = [];

function makeWindow(opts){
  const el = document.createElement('div');
  el.className = 'win' + (opts.paper ? ' paper' : '');
  /* clamp to the viewport so a 350px window still fits a phone */
  const M = 8;
  const w = Math.min(opts.w || 340, Math.max(200, innerWidth - M * 2));
  const x = Math.max(M, Math.min(opts.x || 90, innerWidth - w - M));
  const y = opts.y || 70;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.width = w + 'px';
  el.style.height = typeof opts.h === 'number'
    ? Math.min(opts.h, Math.max(140, innerHeight - y - 56)) + 'px'
    : (opts.h || 240) + 'px';
  el.style.zIndex = ++z;
  el.innerHTML =
    '<div class="tb"><span class="t">' + esc(opts.title) + '</span>' +
    '<button class="x" aria-label="close">✕</button></div>' +
    '<div class="body"></div>';
  el.querySelector('.body').appendChild(opts.content);
  document.body.appendChild(el);

  const rec = { el, title: opts.title, onClose: opts.onClose };
  wins.push(rec);
  el.addEventListener('pointerdown', () => { el.style.zIndex = ++z; }, true);
  el.querySelector('.x').addEventListener('click', () => closeWindow(rec));
  dragify(el, el.querySelector('.tb'));
  drawTasks();
  return rec;
}

function closeWindow(rec){
  if (rec.onClose && rec.onClose() === false) return;
  rec.el.remove();
  wins = wins.filter(w => w !== rec);
  drawTasks();
}

function dragify(el, handle){
  let sx = 0, sy = 0, ox = 0, oy = 0, on = false;
  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    on = true; sx = e.clientX; sy = e.clientY;
    ox = parseInt(el.style.left, 10); oy = parseInt(el.style.top, 10);
    handle.setPointerCapture(e.pointerId);
    handle.style.cursor = 'grabbing';
  });
  handle.addEventListener('pointermove', (e) => {
    if (!on) return;
    const barTop = era.bar === 'top' ? parseInt(getComputedStyle(document.body).getPropertyValue('--bar-h')) || 34 : 0;
    el.style.left = Math.max(-el.offsetWidth + 70, Math.min(innerWidth - 60, ox + e.clientX - sx)) + 'px';
    el.style.top = Math.max(barTop, Math.min(innerHeight - 40, oy + e.clientY - sy)) + 'px';
  });
  const up = () => { on = false; handle.style.cursor = 'grab'; };
  handle.addEventListener('pointerup', up);
  handle.addEventListener('pointercancel', up);
}

function drawTasks(){
  $('tasks').innerHTML = '';
  for (const w of wins){
    const b = document.createElement('button');
    b.textContent = w.title;
    b.addEventListener('click', () => { w.el.style.zIndex = ++z; });
    $('tasks').appendChild(b);
  }
}

/* ---- the applications --------------------------------------------- */

function aboutHTML(){
  return '<div style="font-weight:700;font-size:calc(var(--ui-size) + 3px);margin-bottom:3px">' +
      esc(era.name) + '</div>' +
    '<div style="opacity:.7;margin-bottom:11px">' + esc(era.year) + ' · ' + esc(era.tagline) + '</div>' +
    '<div style="line-height:1.85">' + era.about.map(esc).join('<br>') + '</div>' +
    '<div style="margin-top:12px;opacity:.6;line-height:1.6">This machine is invented, and so is the ' +
    'operating system on it. The specifications above are part of the fiction.</div>';
}
function openAbout(){
  const d = document.createElement('div');
  d.innerHTML = aboutHTML();
  const rec = makeWindow({ title:'About This Computer', content:d, w:350, h:318, x:120, y:96 });
  // it is the same machine in every era, so this window restates itself
  rec.refresh = () => { d.innerHTML = aboutHTML(); };
}

function openFiles(){
  const d = document.createElement('div');
  d.className = 'listing';
  d.innerHTML = FILES.map((f, i) =>
    '<div class="row" data-i="' + i + '"><span class="n">' + esc(f.n) + '</span>' +
    '<span class="s">' + esc(f.s) + '</span></div>').join('');
  d.addEventListener('dblclick', (e) => {
    const row = e.target.closest('.row');
    if (!row) return;
    const f = FILES[+row.dataset.i];
    if (f.body === null) return dialog('Cannot open ' + f.n,
      'This file was made by a program that is not on this computer, and has not been for some years.');
    openNotepad(f.n, f.body);
  });
  makeWindow({ title:'C:\\', content:d, paper:true, w:330, h:230, x:210, y:150 });
}

function openNotepad(name, body){
  const t = document.createElement('textarea');
  t.value = body || '';
  t.spellcheck = false;
  const initial = t.value;
  const rec = makeWindow({
    title: name || 'UNTITLED.TXT', content:t, paper:true, w:400, h:280, x:170, y:120,
    onClose: () => {
      if (t.value === initial) return true;
      dialog('Save changes to ' + (name || 'UNTITLED.TXT') + '?',
        'There is no disk in this computer, so there is nowhere to save it to. ' +
        'It will be gone either way.',
        [{ label:'Discard', act: () => { rec.el.remove(); wins = wins.filter(w => w !== rec); drawTasks(); } },
         { label:'Keep it open' }]);
      return false;
    },
  });
  setTimeout(() => t.focus(), 30);
}

function openPaint(){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'width:100%;height:100%;display:flex;flex-direction:column;background:#fff';
  const cv = document.createElement('canvas');
  cv.style.cssText = 'flex:1;width:100%;display:block;cursor:crosshair;touch-action:none';
  const tools = document.createElement('div');
  tools.style.cssText = 'display:flex;gap:5px;padding:5px;flex:0 0 auto;background:var(--face)';
  wrap.appendChild(cv); wrap.appendChild(tools);
  const rec = makeWindow({ title:'Doodle', content:wrap, paper:true, w:330, h:280, x:270, y:190 });

  const ctx = cv.getContext('2d');
  let colour = era.id === 'e84' ? '#000' : '#1A1A1A', size = 3, drawing = false;
  const fit = () => {
    const r = cv.getBoundingClientRect();
    const img = ctx.getImageData ? null : null;
    const dpr = Math.min(2, devicePixelRatio || 1);
    const data = cv.width ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
    cv.width = Math.max(10, Math.round(r.width * dpr));
    cv.height = Math.max(10, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
    if (data) ctx.putImageData(data, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  };
  setTimeout(fit, 20);
  const swatches = era.id === 'e84'
    ? ['#000000', '#FFFFFF']
    : ['#1A1A1A','#C0392B','#2E86C1','#27AE60','#F1C40F','#8E44AD','#FFFFFF'];
  for (const c of swatches){
    const b = document.createElement('button');
    b.style.cssText = 'width:20px;height:20px;border:2px solid;border-color:var(--lo2) var(--hi) var(--hi) var(--lo2);cursor:pointer;background:' + c;
    b.setAttribute('aria-label', 'colour ' + c);
    b.addEventListener('click', () => { colour = c; });
    tools.appendChild(b);
  }
  const clear = document.createElement('button');
  clear.className = 'b'; clear.textContent = 'clear'; clear.style.marginLeft = 'auto';
  clear.addEventListener('click', () => {
    const r = cv.getBoundingClientRect();
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
  });
  tools.appendChild(clear);

  let px = 0, py = 0;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  cv.addEventListener('pointerdown', (e) => {
    drawing = true; [px, py] = pos(e); cv.setPointerCapture(e.pointerId);
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.arc(px, py, size / 2, 0, 6.2832); ctx.fill();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const [x, y] = pos(e);
    ctx.strokeStyle = colour; ctx.lineWidth = size;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x, y); ctx.stroke();
    px = x; py = y;
  });
  const stop = () => { drawing = false; };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  window.addEventListener('resize', fit);
}

function openBin(){
  dialog('Wastebasket', 'Empty. Whatever was in here was emptied by somebody who is no longer at this desk.');
}

function dialog(title, text, buttons){
  const d = document.createElement('div');
  d.innerHTML = '<div style="line-height:1.65">' + esc(text) + '</div><div class="btnrow"></div>';
  const rec = makeWindow({
    title, content:d, w:320, h:'auto',
    x: Math.round(innerWidth / 2 - 160), y: Math.round(innerHeight / 2 - 90),
  });
  rec.el.style.height = 'auto';
  const row = d.querySelector('.btnrow');
  for (const b of (buttons || [{ label:'OK' }])){
    const btn = document.createElement('button');
    btn.className = 'b';
    btn.textContent = b.label;
    btn.addEventListener('click', () => { closeWindow(rec); if (b.act) b.act(); });
    row.appendChild(btn);
  }
  setTimeout(() => { const f = row.querySelector('button'); if (f) f.focus(); }, 20);
  return rec;
}

/* ---- desktop + menu ------------------------------------------------ */

const DESKTOP = [
  { key:'disk',   label:'This Computer', open:openAbout },
  { key:'folder', label:'C:\\',          open:openFiles },
  { key:'note',   label:'Notepad',       open:() => openNotepad(null, '') },
  { key:'paint',  label:'Doodle',        open:openPaint },
  { key:'bin',    label:'Wastebasket',   open:openBin },
];

function drawIcons(){
  const c = glyphColours();
  $('icons').innerHTML = '';
  for (const it of DESKTOP){
    const el = document.createElement('div');
    el.className = 'icon';
    el.tabIndex = 0;
    el.innerHTML = '<div class="g">' + GLYPHS[it.key](c) + '</div><span>' + esc(it.label) + '</span>';
    let t = 0;
    el.addEventListener('click', () => {
      document.querySelectorAll('.icon').forEach(i => i.classList.remove('sel'));
      el.classList.add('sel');
      const now = Date.now();
      if (now - t < 420) it.open();          // double click, the period-correct way
      t = now;
    });
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') it.open(); });
    $('icons').appendChild(el);
  }
  $('icons').style.top = era.bar === 'top' ? 'calc(var(--bar-h) + 10px)' : '10px';
  // the switcher has to get out of the way of a bar along the top
  $('switch').style.top = era.bar === 'top' ? 'calc(var(--bar-h) + 10px)' : '10px';
}

function drawMenu(){
  $('menu').innerHTML =
    '<div class="head">' + esc(era.name) + '</div>' +
    DESKTOP.map((d, i) => '<div class="mi" data-i="' + i + '">' + esc(d.label) + '</div>').join('') +
    '<div class="sep"></div>' +
    '<div class="mi" data-act="restart">Restart</div>' +
    '<div class="mi" data-act="shutdown">Shut Down…</div>';
}
$('menu').addEventListener('click', (e) => {
  const mi = e.target.closest('.mi');
  if (!mi) return;
  $('menu').classList.remove('open');
  if (mi.dataset.act === 'shutdown'){
    dialog('Shut down', 'It is now safe to close this tab. Everything you made will not be kept, ' +
      'because there was never anywhere to keep it.');
    return;
  }
  if (mi.dataset.act === 'restart'){
    for (const w of wins.slice()) { w.el.remove(); }
    wins = []; drawTasks();
    dialog('Restarting', 'Memory test: 640 K OK. That is all the memory there is, and it is fine.');
    return;
  }
  DESKTOP[+mi.dataset.i].open();
});
$('start').addEventListener('click', (e) => {
  e.stopPropagation();
  const m = $('menu');
  m.classList.toggle('open');
  const b = $('start').getBoundingClientRect();
  if (era.bar === 'top'){ m.style.top = b.bottom + 'px'; m.style.bottom = 'auto'; }
  else { m.style.bottom = (innerHeight - b.top) + 'px'; m.style.top = 'auto'; }
  m.style.left = b.left + 'px';
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#menu') && !e.target.closest('#start')) $('menu').classList.remove('open');
});

/* ---- eras ---------------------------------------------------------- */

function setEra(next){
  era = next;
  document.body.className = era.id;
  $('start').textContent = era.start;
  $('bar').classList.toggle('top', era.bar === 'top');
  drawIcons();
  drawMenu();
  for (const b of $('switch').children) b.setAttribute('aria-pressed', String(b.dataset.id === era.id));
  // windows survive the switch — it is the same machine, redecorated
  for (const w of wins) if (w.refresh) w.refresh();
  document.title = era.name + ' — ' + era.year;
}

for (const e of ERAS){
  const b = document.createElement('button');
  b.textContent = e.year;
  b.dataset.id = e.id;
  b.title = e.name;
  b.addEventListener('click', () => setEra(e));
  $('switch').appendChild(b);
}

function tick(){
  const d = new Date();
  const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
  $('clock').textContent = era.id === 'e84' || era.id === 'e91'
    ? (h % 12 || 12) + ':' + m + ' ' + (h >= 12 ? 'PM' : 'AM')
    : (h % 12 || 12) + ':' + m + ' ' + (h >= 12 ? 'PM' : 'AM');
}
setInterval(tick, 10000);
tick();

setEra(ERAS[1]);
openAbout();
</script>
<script>
/* ==================================================================== *
 *  Right-click the desktop.
 *
 *  Everything in here is inert. The one item that looks like it is not
 *  is the most inert of all.
 * ==================================================================== */
(function(){
  'use strict';
  var desk = document.getElementById('desk');
  if (!desk) return;

  var ctx = document.createElement('div');
  ctx.id = 'ctx'; ctx.hidden = true; ctx.setAttribute('role', 'menu');
  ctx.innerHTML =
    '<button type="button" disabled>New Folder</button>' +
    '<button type="button" disabled>Arrange Icons</button>' +
    '<button type="button" disabled>Line Up Icons</button>' +
    '<hr>' +
    '<button type="button" disabled>Paste</button>' +
    '<button type="button" disabled>Paste Shortcut</button>' +
    '<hr>' +
    '<button type="button" data-do="format">Format C:</button>' +
    '<button type="button" disabled>Properties</button>';
  document.body.appendChild(ctx);

  var box = document.createElement('div');
  box.id = 'ctxbox'; box.hidden = true; box.setAttribute('role', 'dialog');
  box.innerHTML =
    '<div class="tb">Format C:</div>' +
    '<div class="bd" id="ctxmsg"></div>' +
    '<div class="ft"><button type="button" id="ctxok">OK</button></div>';
  document.body.appendChild(box);

  var LINES = [
    'Nothing happened. There is no C: drive. There is no drive at all — this is a ' +
      'drawing of a computer, and you have just tried to wipe a drawing.',
    'Formatting would require something to format. Please supply one.',
    'The operation completed successfully and had no effect whatsoever.',
    'You have done this before. It did nothing then as well.'
  ];
  var used = 0;

  function close(){ ctx.hidden = true; }

  desk.addEventListener('contextmenu', function(e){
  if (window.LCAch) LCAch.fire('retroos.rightclick');
    e.preventDefault();
    ctx.hidden = false;
    // keep the whole menu on screen even at the very edge
    var r = ctx.getBoundingClientRect();
    var x = Math.min(e.clientX, window.innerWidth - r.width - 6);
    var y = Math.min(e.clientY, window.innerHeight - r.height - 6);
    ctx.style.left = Math.max(4, x) + 'px';
    ctx.style.top = Math.max(4, y) + 'px';
  });
  window.addEventListener('pointerdown', function(e){
    // e.target is not always an element — contains() needs one
    var t = (e.target && e.target.nodeType === 1) ? e.target : null;
    if (!ctx.hidden && (!t || !ctx.contains(t))) close();
  });
  window.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });

  ctx.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b || b.disabled) return;
    close();
    if (b.dataset.do === 'format'){
      document.getElementById('ctxmsg').textContent = LINES[Math.min(used, LINES.length - 1)];
      used++;
      box.hidden = false;
    }
  });
  document.getElementById('ctxok').addEventListener('click', function(){ box.hidden = true; });

  window.__ctx = function(){
    return { menuHidden: ctx.hidden, boxHidden: box.hidden,
             items: ctx.querySelectorAll('button').length,
             enabled: [].filter.call(ctx.querySelectorAll('button'), function(b){ return !b.disabled; }).length,
             msg: document.getElementById('ctxmsg').textContent.slice(0, 40) };
  };
})();
</script>

<script>
(function(){
  /* A beige machine acknowledging a click, in the only voice it has. */
  function cue(){ if (window.LCSound) LCSound.play(function(A){
    A.blip(1046, { dur: 0.055, level: A.cap(0.045), type: 'square' });
    A.blip(1568, { at: 0.055, dur: 0.09, level: A.cap(0.04), type: 'square' });
  }); }
  document.addEventListener('click', function(e){
    if (e.target.closest && !e.target.closest('#lc-sound-btn') && e.target.closest("button")) cue();
  });
  if (window.LCSound) LCSound.mount();
})();
</script>
<style>
/* A window redrawn by a machine that redraws windows visibly. */
@keyframes lcf-tick{from{transform:translateX(-4px)}60%{transform:translateX(2px)}to{transform:none}}
.lc-flourish{animation:lcf-tick .22s ease-out both}
@media (prefers-reduced-motion: reduce){ .lc-flourish{animation:none} }
</style>
<script>
(function(){
  /* The thing this toy makes should arrive, not appear. Replaying the
     animation means taking the class off, forcing a reflow, and putting
     it back — without the reflow the browser coalesces the two changes
     and nothing moves the second time. */
  var SEL = [".win",".window","#screen",".screen","main"];
  function flourish(){
    var el = null;
    for (var i = 0; i < SEL.length && !el; i++) el = document.querySelector(SEL[i]);
    if (!el) return;
    el.classList.remove("lc-flourish");
    void el.offsetWidth;
    el.classList.add("lc-flourish");
  }
  document.addEventListener('click', function(e){
    if (!e.target.closest || e.target.closest('#lc-sound-btn')) return;
    if (e.target.closest('button, .term, .cap, a, li, canvas')) setTimeout(flourish, 30);
  });
})();
</script>
