<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:url('file:///Users/sapper/Desktop/little inventions/hub/tools/og/desktop-backdrop.png') no-repeat center/cover;position:relative;
  font-family:"Pixelated MS Sans Serif",Tahoma,Geneva,Verdana,sans-serif}
.scrim{position:absolute;inset:0;background:rgba(10,30,32,.42)}
.win{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);width:730px;
  background:#C3C7CB;border:2px solid #fff;border-right-color:#404040;border-bottom-color:#404040;
  box-shadow:5px 5px 0 rgba(0,0,0,.45)}
.bar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:6px 10px;
  font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.btns{display:flex;gap:4px}
.b{width:010px;height:20px;width:22px;background:#C3C7CB;border:2px solid #fff;
  border-right-color:#404040;border-bottom-color:#404040;color:#000;font-size:13px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.body{padding:30px 34px 34px;color:#000}
h1{font-family:ui-serif,Georgia,serif;font-style:italic;font-weight:400;font-size:60px;line-height:1.02}
.tag{margin-top:16px;font-size:20px;line-height:1.5;color:#1a1a1a;max-width:44ch}
.meta{margin-top:24px;display:flex;align-items:center;gap:12px;border-top:1px solid #8d9095;padding-top:18px}
.chip{background:#000080;color:#fff;font-size:14px;padding:5px 11px;letter-spacing:.04em}
.url{font-family:ui-monospace,Menlo,monospace;font-size:17px;color:#2a2a2a}
</style></head><body>
<div class="scrim"></div>
<div class="win">
  <div class="bar"><span>Little Contraptions</span><div class="btns"><div class="b">_</div><div class="b">□</div><div class="b">×</div></div></div>
  <div class="body">
    <h1>Little Contraptions</h1>
    <p class="tag">A small, growing cabinet of things built instead of sleeping. No two drawers alike.</p>
    <div class="meta"><span class="chip">139 TOYS</span><span class="url">contraptions.up.railway.app</span></div>
  </div>
</div>
</body></html>
